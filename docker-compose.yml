services:
  mongo:
    image: mongo:7
    container_name: walnut-ledger-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/rs-init.js:/docker-entrypoint-initdb.d/rs-init.js:ro
volumes:
  mongo_data:
